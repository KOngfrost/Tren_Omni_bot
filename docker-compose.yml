x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    container_name: oss_bot_db
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: oss_bot_pgbouncer
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 64m
    memswap_limit: 64m
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:?POSTGRES_USER is required}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - DB_NAME=${POSTGRES_DB:?POSTGRES_DB is required}
      - LISTEN_PORT=6432
      - POOL_MODE=transaction
      - AUTH_TYPE=scram-sha-256
      - MAX_CLIENT_CONN=300
      - DEFAULT_POOL_SIZE=25
      - MIN_POOL_SIZE=5
      - RESERVE_POOL_SIZE=5
      - SERVER_RESET_QUERY=DISCARD ALL
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oss_bot_migrate
    restart: "no"
    logging: *default-logging
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USE_PGBOUNCER=false
    command: python -m alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oss_bot_app
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    memswap_limit: 256m
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - HEARTBEAT_FILE=/tmp/oss_bot_heartbeat
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - APP_VERSION=${APP_VERSION:-0.8.4.1}
    command: python main.py
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck_bot.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  netbird:
    image: netbirdio/netbird:latest
    container_name: oss_bot_netbird
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    memswap_limit: 128m
    hostname: oss-web-panel
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - NB_SETUP_KEY=${NETBIRD_SETUP_KEY:-}
      - NB_MANAGEMENT_URL=${NETBIRD_MANAGEMENT_URL:-https://api.netbird.io:443}
      - NB_HOSTNAME=oss-web-panel
      - NB_LOG_LEVEL=info
    volumes:
      - netbird_data:/etc/netbird
    healthcheck:
      test: ["CMD", "netbird", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: oss_bot_redis
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 64m
    memswap_limit: 64m
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web-admin:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: oss_bot_web
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 640m
    memswap_limit: 640m
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - APP_VERSION=${APP_VERSION:-0.8.4.1}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: oss_bot_prometheus
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    memswap_limit: 128m
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      web-admin:
        condition: service_healthy

  tg-monitor:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    container_name: oss_bot_tg_monitor
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    memswap_limit: 256m
    group_add:
      - "988"
      - "docker"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - APP_VERSION=${APP_VERSION:-0.8.4.1}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/backups/oss_bot:/var/backups/oss_bot
    command: python scripts/run_tg_monitor.py
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, os; sys.exit(0 if os.path.exists('/var/run/docker.sock') else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    container_name: oss_bot_caddy
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    memswap_limit: 128m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web-admin:
        condition: service_healthy

volumes:
  postgres_data:
  netbird_data:
  redis_data:
  prometheus_data:
  caddy_data:
  caddy_config:

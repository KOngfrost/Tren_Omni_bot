
services:
  db:
    image: postgres:15-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-student_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-student_bot}
      POSTGRES_DB: ${POSTGRES_DB:-oss_bot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - bot_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-student_bot} -d ${POSTGRES_DB:-oss_bot}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    env_file: .env
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    networks:
      - bot_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: pgbouncer:1.22
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-student_bot}:${POSTGRES_PASSWORD:-student_bot}@db:5432/${POSTGRES_DB:-oss_bot}
      PGBOUNCER_MAX_CLIENT_CONN: "300"
      PGBOUNCER_DEFAULT_POOL_SIZE: "20"
      PGBOUNCER_POOL_MODE: "transaction"
    ports:
      - "6432:6432"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bot_net

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DB_HOST: pgbouncer
      DB_PORT: "6432"
      DB_USE_PGBOUNCER: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bot_net

  web-admin:
    build:
      context: .
      dockerfile: Dockerfile.web
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DB_HOST: pgbouncer
      DB_PORT: "6432"
      DB_USE_PGBOUNCER: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - bot_net

  tg-monitor:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    user: "1000:1000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - bot_net

volumes:
  postgres_data:

networks:
  bot_net:
    driver: bridge

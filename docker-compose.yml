x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    container_name: oss_bot_db
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # SEC-12: генерация pgbouncer/userlist.txt.
  # Разовая задача, завершается ДО старта pgbouncer. Читает готовый
  # SCRAM-SHA-256 verifier из pg_authid и кладёт его в общий том с
  # правами 0600. Открытые пароли при этом нигде не хранятся.
  pgbouncer-userlist:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oss_bot_pgbouncer_userlist
    restart: "no"
    user: "0:0"
    logging: *default-logging
    mem_limit: 128m
    memswap_limit: 128m
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USE_PGBOUNCER=false
    volumes:
      - pgbouncer_config:/etc/pgbouncer
    command: python scripts/generate_pgbouncer_userlist.py --out /etc/pgbouncer/userlist.txt
    depends_on:
      db:
        condition: service_healthy

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: oss_bot_pgbouncer
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 64m
    memswap_limit: 64m
    # Свой pgbouncer.ini с auth_query (SEC-12). При наличии смонтированного
    # файла автогенерация конфига в entrypoint НЕ выполняется, поэтому все
    # параметры пула обязаны быть заданы явно — они и заданы в pgbouncer/.
    volumes:
      - pgbouncer_config:/etc/pgbouncer
    environment:
      # Подстановки ${...} в pgbouncer.ini выполняет entrypoint образа.
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:?POSTGRES_DB is required}
      # Служебная роль для auth_query: её verifier лежит в userlist.txt,
      # а право EXECUTE на pgbouncer.get_auth выдаёт миграция b4c5d6e7f8a.
      - AUTH_USER=${POSTGRES_USER:?POSTGRES_USER is required}
      # Нужен только для healthcheck: psql входит через сам пул.
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB is required}
    healthcheck:
      # psql идёт через сам пул: проверяются не только порт и процесс,
      # но и успешная аутентификация SCRAM и работоспособность auth_query.
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$${POSTGRES_PASSWORD}"
          psql -h 127.0.0.1 -p 6432 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
          -tAc 'SELECT 1' | grep -q 1 || exit 1
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      pgbouncer-userlist:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oss_bot_migrate
    restart: "no"
    logging: *default-logging
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USE_PGBOUNCER=false
    command: python -m alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oss_bot_app
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    memswap_limit: 256m
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - HEARTBEAT_FILE=/tmp/oss_bot_heartbeat
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - APP_VERSION=${APP_VERSION:-0.8.8.4}
    command: python main.py
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck_bot.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    container_name: oss_bot_redis
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 384m
    memswap_limit: 384m
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web-admin:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: oss_bot_web
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 640m
    memswap_limit: 640m
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - APP_VERSION=${APP_VERSION:-0.8.8.4}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  go-api:
    build:
      context: ./backend_go
      dockerfile: Dockerfile
    container_name: oss_bot_go_api
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    memswap_limit: 128m
    env_file:
      - .env
    environment:
      - PORT=8080
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000, http://127.0.0.1:3000, http://localhost:8000}
    # Healthcheck (этап 5.2): HTTP GET /api/v1/health.
    # Проба идёт по реальному TCP+HTTP, поэтому ловит не только падение
    # процесса, но и зависание event loop (процесс жив, а не отвечает).
    # Docker сам перезапустит контейнер после 3 неудач подряд.
    # Образ backend_go/Dockerfile основан на alpine, где wget есть в busybox,
    # поэтому curl доустанавливать не нужно.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: oss_bot_prometheus
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    memswap_limit: 128m
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      web-admin:
        condition: service_healthy
      # go-api должен пройти healthcheck (этап 5.2) до старта Prometheus:
      # иначе первые скрейпы дают ложные алерты GoApiInstanceDown.
      go-api:
        condition: service_healthy

  tg-monitor:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    container_name: oss_bot_tg_monitor
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    memswap_limit: 256m
    group_add:
      - "988"
      - "docker"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - APP_VERSION=${APP_VERSION:-0.8.8.4}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/backups/oss_bot:/var/backups/oss_bot
    command: python scripts/run_tg_monitor.py
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, os; sys.exit(0 if os.path.exists('/var/run/docker.sock') else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    container_name: oss_bot_caddy
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    memswap_limit: 128m
    env_file:
      - .env
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web-admin:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  caddy_data:
  caddy_config:
  # Конфигурация PgBouncer и генерируемый userlist.txt (SEC-12).
  # Отдельный том: userlist.txt пишется одноразовым сервисом
  # pgbouncer-userlist, а читается постоянно работающим pgbouncer.
  pgbouncer_config:

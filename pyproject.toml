# ============================================================
# Единая конфигурация инструментария: ruff (lint + format) и pytest.
# mypy живёт в mypy.ini. Файлы ruff.toml и pytest.ini удалены:
# ruff отдаёт приоритет ruff.toml над pyproject.toml, а pytest —
# pytest.ini, из-за чего конфигурация дублировалась и конфликтовала.
# ============================================================
[project]
name = "student-bot"
version = "0.8.3.16"
description = "OSS Bot: Student Ticket Management System"
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
line-length = 99
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors (включая E402)
    "W",      # pycodestyle warnings
    "F",      # pyflakes: F401 unused imports, F841 unused vars, F811 redefinitions
    "B",      # flake8-bugbear: вероятные баги
    "C901",   # mccabe: цикломатическая сложность
    "I",      # isort: порядок импортов
    "UP",     # pyupgrade: современный синтаксис
    "PERF",   # perflint: производительность
    "RUF",    # собственные правила ruff
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",    # длина строки — делегирована formatter
    "B008",    # вызов функции в дефолтном аргументе (паттерн FastAPI Depends)
    # Кириллические «омоглифы» в русских строках/докстрингах/комментариях —
    # ложные срабатывания для русскоязычного проекта
    "RUF001",
    "RUF002",
    "RUF003",
    # Класс-конфигурация Settings (config-holder, не pydantic BaseSettings)
    # хранит смысловые неизменяемые коллекции как атрибуты класса
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
# Патч vkbottle (patch_vkbottle_logging) обязан выполниться ДО импортов
# vkbottle: сортировка импортов (I) и E402 отключены здесь намеренно.
"bots/vk/bot.py" = ["E402", "I"]
# Роутеры подключаются после создания app и настройки middleware.
"web/main.py" = ["E402"]
# Тесты: импорты идут после настройки окружения в conftest.py.
"tests/**/*" = ["E402"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ============================================================
# Mypy — static type checking (конфигурация в mypy.ini)
# ============================================================
# ВНИМАНИЕ: этот файл обязан оставаться валидным TOML.
# Alembic 1.16+ автоматически читает pyproject.toml (в поисках
# [tool.alembic]) даже при использовании alembic.ini — невалидный
# TOML обрывает миграции: tomllib.TOMLDecodeError.
# Обычная INI-секция [mypy] здесь не читается mypy и ломает парсинг.

# ============================================================
# Pytest (ранее дублировалось в pytest.ini)
# ============================================================
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
addopts = "--cov=core --cov=web --cov=bots --cov-report=term-missing"

# ============================================================
# Coverage (pytest-cov)
# ============================================================
[tool.coverage.run]
branch = true
source = ["core", "web", "bots"]
omit = [
    "tests/*",
    "alembic/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1

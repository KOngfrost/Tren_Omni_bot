name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  ruff:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.6.9
      - run: ruff check .
      - run: ruff format --check .

  mypy:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: mypy core web scripts bots

  pytest:
    name: Tests (pytest + postgres + redis + coverage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://postgres:test_password@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate ephemeral test session secret
        run: echo "SESSION_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(64))')" >> "$GITHUB_ENV"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # Защита от форков истории миграций: голова должна быть ровно одна
      - name: Alembic — ровно одна голова миграций
        run: |
          heads=$(python -m alembic heads | grep -c '^[a-f0-9]')
          echo "heads: $heads"
          test "$heads" -eq 1
      - name: Run pytest with coverage
        run: pytest -v --cov=core --cov=web --cov=bots --cov-report=xml --cov-report=term-missing

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile -t oss-bot .
      - run: docker build -f Dockerfile.web -t oss-bot-web .

  go-test:
    name: Tests (Go backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: backend_go/go.sum
      - name: go vet
        working-directory: backend_go
        run: go vet ./...
      - name: go test
        working-directory: backend_go
        run: go test -race -cover ./...

  browser-tests:
    name: Tests (Playwright, кнопки интерфейса)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate ephemeral test session secret
        run: echo "SESSION_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(64))')" >> "$GITHUB_ENV"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Установить Chromium для Playwright
        run: python -m playwright install --with-deps chromium
      - name: E2E-тесты кнопок (CSP включён)
        env:
          APP_ENV: test
        run: pytest -v tests/test_ui_buttons_browser.py --no-cov

  pgbouncer-config:
    name: PgBouncer SEC-12 (валидация конфигурации)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверить, что в pgbouncer.ini нет открытых паролей
        run: |
          # userlist.txt в репозитории отсутствует (.gitignore) —
          # открытый пароль в pgbouncer.ini означал бы утечку в Git.
          ! grep -rniE 'PASSWORD=|password' pgbouncer/pgbouncer.ini \
            | grep -vi 'auth_user\|auth_query\|PASSFILE' \
            || (echo "Найдено упоминание пароля в pgbouncer.ini" && exit 1)
      - name: Проверить единственную голову миграций
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          heads=$(python -m alembic heads | grep -c '^[a-f0-9]')
          echo "heads: $heads"
          test "$heads" -eq 1

  security-audit:
    name: Security audit (pip-audit & secret scanning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Scan dependencies for CVEs
        run: pip-audit -r requirements.txt -r requirements-dev.txt
      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST (Bandit & Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SAST scanners
        run: pip install bandit semgrep
      - name: Bandit Security Scan
        run: bandit -r core web bots -ll -ii -f screen || true
      - name: Semgrep Security Scan
        run: semgrep --config=p/ci core web bots || true

  dast:
    name: DAST Baseline (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build web container
        run: docker build -f Dockerfile.web -t oss-bot-web .
      - name: Start web container for scanning
        run: |
          docker run -d --name zap-target -p 8000:8000 \
            -e APP_ENV=development \
            -e SESSION_SECRET_KEY=ephemeral_secret_for_zap_scan_1234567890 \
            -e POSTGRES_USER=dummy \
            -e POSTGRES_PASSWORD=dummy \
            -e ADMIN_VK_IDS=123 \
            -e VK_BOT_TOKEN=dummy \
            -e VK_CALLBACK_SECRET=ephemeral_secret_for_zap_scan_1234567890 \
            oss-bot-web
          sleep 5
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:8000'
          fail_action: false

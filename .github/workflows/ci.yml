name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  ruff:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.6.9
      - run: ruff check .
      - run: ruff format --check .

  mypy:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: mypy core web scripts bots

  pytest:
    name: Tests (pytest + postgres + redis + coverage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://postgres:test_password@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379/0
      SESSION_SECRET_KEY: ci_super_secret_session_key_1234567890_test
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # Защита от форков истории миграций: голова должна быть ровно одна
      - name: Alembic — ровно одна голова миграций
        run: |
          heads=$(python -m alembic heads | grep -c '^[a-f0-9]')
          echo "heads: $heads"
          test "$heads" -eq 1
      - name: Run pytest with coverage
        run: pytest -v --cov=core --cov=web --cov=bots --cov-report=xml --cov-report=term-missing

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile -t oss-bot .
      - run: docker build -f Dockerfile.web -t oss-bot-web .

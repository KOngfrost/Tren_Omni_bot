<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ error_title }} - OSS Web Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/app.js" defer></script>
</head>
<body>
    <div class="error-page">
        <div class="error-card">
            <div class="error-icon">{{ error_icon }}</div>
            <div class="error-code">{{ error_code }}</div>
            <div class="error-title">{{ error_title }}</div>
            <div class="error-message">{{ error_message }}</div>
            {% if error_id %}
            <div class="error-support-code">Код обращения для техподдержки: <code>{{ error_id }}</code></div>
            {% endif %}
            <div class="error-actions">
                {% if show_refresh %}
                <button class="btn btn-primary" type="button" data-error-action="reload">↻ Обновить страницу</button>
                {% endif %}
                {% if show_back %}
                <button class="btn btn-secondary" type="button" data-error-action="back">← Вернуться назад</button>
                {% endif %}
                {% if show_home %}
                <a class="btn btn-secondary" href="/">⌂ На главную</a>
                {% endif %}
            </div>
        </div>
    </div>
</body>
</html>

; ============================================================
; PgBouncer — конфигурация пула соединений (SEC-12)
; ============================================================
; Файл монтируется в /etc/pgbouncer/pgbouncer.ini:ro, поэтому автогенерация
; конфига в entrypoint НЕ выполняется (при наличии файла скрипт его не
; перезаписывает) — все параметры ниже обязательны и явны.
;
; Переменные вида ${NAME} и ${NAME:-default} подставляет entrypoint
; edoburu/docker-pgbouncer из окружения контейнера.
;
; Ключевое отличие от автоконфигурации — прозрачная авторизация через
; PostgreSQL (auth_query). PgBouncer берёт SCRAM-SHA-256 verifier
; пользователя напрямую из pg_authid, поэтому:
;   * пароль нигде не хранится в открытом виде;
;   * userlist.txt достаточно держать актуальным для ОДНОГО служебного
;     пользователя (auth_user), а не для каждого клиента БД;
;   * ротация паролей в PostgreSQL не требует перезапуска PgBouncer.
;
; Требования к auth_user (выполняются миграцией Alembic b4c5d6e7f8a):
;   * роль должна иметь право EXECUTE на pgbouncer.get_auth(TEXT);
;   * её собственный SCRAM-verifier обязан быть в userlist.txt.
; ============================================================

[databases]
; Единственная точка входа в БД: bot, web-admin и go-api ходят в базу
; через pgbouncer:6432. Параметр auth_user указывает, от лица какой роли
; выполняется auth_query к серверу PostgreSQL.
${DB_NAME} = host=${DB_HOST} port=${DB_PORT} auth_user=${AUTH_USER}

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /tmp

; Транзакционный пул: сессионное состояние (SET, prepared statements)
; не переживает завершение транзакции. Все приложения проекта используют
; параметризованные запросы, поэтому ограничений на них нет.
pool_mode = transaction

; --- Аутентификация (SEC-12) ---
; scram-sha-256 соответствует POSTGRES_HOST_AUTH_METHOD=scram-sha-256
; у сервера PostgreSQL: открытый пароль по сети не передаётся.
auth_type = scram-sha-256
; Файл со SCRAM-SHA-256 verifier'ами. Генерируется сервисом
; pgbouncer-userlist; в репозитории отсутствует (см. .gitignore).
auth_file = /etc/pgbouncer/userlist.txt
; Прозрачная авторизация: verifier любого пользователя читается из БД.
; $1 подставляет PgBouncer — имя подключающегося пользователя.
auth_query = SELECT usename, passwd FROM pgbouncer.get_auth($1)
; Роль, от имени которой выполняется auth_query. PgBouncer подключается
; к серверу БД её паролем из auth_file.
auth_user = ${AUTH_USER}

; --- Размер пула ---
; Потолок одновременных клиентских соединений: бот, веб-панель (до
; WEB_WORKERS процессов) и go-api должны укладываться в этот бюджет.
max_client_conn = 300
; Серверные соединения на пару (база, пользователь).
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
; Глобальные ограничители: защищают PostgreSQL от лавины запросов.
max_db_connections = 50
max_user_connections = 50

; Сброс состояния серверного соединения при возврате в пул —
; обязательный гигиенический минимум для transaction pooling.
server_reset_query = DISCARD ALL
; server_reset_query_always обязателен при смене пользователя на том же
; серверном соединении, иначе возможна утечка состояния между клиентами.
server_reset_query_always = 1

; --- Таймауты и устойчивость ---
server_lifetime = 3600
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 15
query_timeout = 120
query_wait_timeout = 120
; 0 = не отключать простаивающих клиентов: Uvicorn держит keep-alive.
client_idle_timeout = 0
idle_transaction_timeout = 120
; Раннее обнаружение «мёртвых» TCP-соединений.
tcp_keepalive = 1
tcp_keepidle = 300
tcp_keepintvl = 30
tcp_keepcnt = 5

; Отказоустойчивость DNS: приложения дольше переживают перезапуск
; контейнера db, не получая мгновенный NXDOMAIN.
dns_max_ttl = 60
dns_nxdomain_ttl = 30

; --- Логирование ---
; log_connections/log_disconnects выключены намеренно: на нагруженной
; панели они дают десятки тысяч строк в час. Ошибки пула логируются.
log_connections = 0
log_disconnects = 0
log_pooler_errors = 1
log_stats = 1
stats_period = 60
verbose = 0

; --- Администрирование ---
; SHOW STATS/SHOW POOLS и PAUSE/RESUME доступны только этим ролям.
admin_users = ${AUTH_USER}
stats_users = ${AUTH_USER}

# Babel configuration for string extraction
# ============================================================
# Used by pybabel extract to collect interface phrases from the project.
#
# Usage:
#   pybabel extract -F babel.cfg -o messages.pot .
#   pybabel init -i messages.pot -d locale -l ru
#   pybabel update -i messages.pot -d locale
#   pybabel compile -d locale
#
# Extracted domains:
#   _()           - plain translation (gettext)
#   gettext()     - alias for _()
#   ngettext()    - translation with pluralization (singular, plural, n)
#   pgettext()    - translation with context (context, message)
#   n_()          - custom pluralization (form1|form2|form3, count)
#   trans/endtrans - Jinja2 templates
#
# Jinja2 extension: jinja2.ext.i18n is enabled in templating.py
# ============================================================

[python: **.py]
encoding = utf-8

[jinja2: **/templates/**.html]
encoding = utf-8
extensions = jinja2.ext.i18n
callable = _, gettext, ngettext, pgettext, n_

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: "oss_bot_web"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["web-admin:8000"]
        labels:
          app: "student_bot"
          role: "web-admin"
